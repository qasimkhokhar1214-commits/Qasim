<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خوش آمدید قاسم</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --ink:#12343b; --accent:#2d8a7b; --accent2:#e0a43a; --card:#fffdf8; --muted:#4f6b70;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e2226; --ink:#f1ead8; --accent:#5fc9b6; --accent2:#f0b955; --card:#16313a; --muted:#a9c2c4;
  }
}
:root[data-theme="dark"]{
  --bg:#0e2226; --ink:#f1ead8; --accent:#5fc9b6; --accent2:#f0b955; --card:#16313a; --muted:#a9c2c4;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",serif;
  display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
}
.card{
  position:relative; width:100%; max-width:520px; background:var(--card);
  border-radius:28px; padding:56px 32px 44px; text-align:center;
  box-shadow:0 20px 50px rgba(18,52,59,.18); overflow:hidden;
}
.card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:10px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}
.wifi{width:110px;height:110px;margin:0 auto 28px;display:block}
.wifi path,.wifi circle{stroke:var(--accent)}
.wifi .dot{fill:var(--accent2);stroke:none}
.wifi .a1{animation:pulse 2.4s ease-in-out infinite}
.wifi .a2{animation:pulse 2.4s ease-in-out .3s infinite}
.wifi .a3{animation:pulse 2.4s ease-in-out .6s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.wifi path{animation:none!important}}
h1{font-size:clamp(34px,9vw,52px);line-height:1.9;margin:0 0 8px;font-weight:700}
h1 span{color:var(--accent)}
p{font-size:clamp(18px,4.5vw,22px);line-height:2.3;margin:0;color:var(--muted)}
.tag{display:inline-block;margin-top:28px;padding:6px 22px;border:2px solid var(--accent2);border-radius:999px;font-size:16px;line-height:2.2;color:var(--ink)}

.photo{width:min(260px,70%);aspect-ratio:4/5;margin:0 auto 28px;border-radius:130px 130px 24px 24px;overflow:hidden;border:5px solid var(--accent2);box-shadow:0 10px 28px rgba(18,52,59,.25)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
.card{padding-top:44px}
.badge{width:64px;height:64px;margin:-52px auto 14px;position:relative;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(18,52,59,.2)}
.badge svg{width:38px;height:38px}
</style>
</head>
